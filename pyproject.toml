[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
 
[project]
name = "power-markets-project"
version = "0.1.0"
description = "Power Markets - Trading and Hedging a Retail Electricity Portfolio (HTW Berlin Summer School)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.24,<3.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<0.14",
    "scipy>=1.11,<2.0",
    "statsmodels>=0.14,<0.15",
    "ipykernel>=7.2.0",
]